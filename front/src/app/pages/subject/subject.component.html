<div class="subjects-container">
    <mat-card class="subject-card" *ngFor="let subject of (subjects$ | async)">
        <mat-card-header>
            <mat-card-title>{{ subject.name }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            {{ subject.description }}
        </mat-card-content>
        <mat-card-actions class="subscribe" align="start">
            <button mat-button (click)="subscribe(subject.id)">S'abonner</button>
        </mat-card-actions>
    </mat-card>
</div>
